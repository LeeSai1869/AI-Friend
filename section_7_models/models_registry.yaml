output_guards:
  none:
    description: Use output as returned.
  strip_reasoning:
    description: Remove leaked chain-of-thought from the model output.
    markers_start:
    - thinking...
    - let me think
    - let's think
    - let's tackle
    - i should
    - i will
    - i need to
    - the user wants
    - the user is asking
    - first,
    - wait,
    - hmm,
    - actually,
    markers_end:
    - '...done thinking'
    - '...done'
    fallback: last_clean_line
    min_acceptable_length: 3
    reject_if:
    - contains_reasoning_markers
    - shorter_than_3_chars
    - only_bullet_points
  strip_markdown:
    description: Remove markdown decoration (asterisks, backticks).
    rules:
    - remove **bold** and *italic*
    - remove backtick code fences when not a code task
routing:
  max_attempts_per_capability: 3
  on_model_failure:
  - try_next_in_priority
  - after_all_fail_escalate_to_trainer
  on_output_guard_failure:
  - try_next_in_priority
  on_all_models_fail:
    action: escalate
    message_to: trainer
    record_as: failure
  memory_preference:
    enabled: true
    match_on:
    - domain
    - capability
    - 'input_similarity_threshold: 0.85'
    fallback_to_llm_if_memory_stale_days: 90
  roster_reordering:
    enabled: true
    evidence_source: memory.source_scores
    min_evidence_count: 3
    do_not_promote_if:
    - any_recent_failure
